name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Smoke test the CLI
        run: |
          python -c "from tests import fixtures; fixtures.build_docx(__import__('pathlib').Path('sample.docx'))"
          python docx_clean.py sample.docx --dry-run
